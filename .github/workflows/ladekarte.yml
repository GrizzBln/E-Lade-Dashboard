# Holt einmal täglich alle Ladestationen in Deutschland aus OpenStreetMap
# und legt sie als kleine Dateien im Ordner "ladepunkte" ab.
# Ablageort dieser Datei im Repo:  .github/workflows/ladekarte.yml
name: Ladekarte aktualisieren

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: ladekarte

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Ladepunkte holen
        run: |
          python3 - <<'PY'
          import datetime, json, os, sys, time, urllib.parse, urllib.request

          SERVERS = [
              'https://overpass-api.de/api/interpreter',
              'https://overpass.private.coffee/api/interpreter',
              'https://overpass.kumi.systems/api/interpreter',
          ]
          KEEP = {'operator', 'brand', 'network', 'name', 'capacity', 'fee', 'charge',
                  'opening_hours', 'check_date', 'addr:street', 'addr:housenumber',
                  'addr:postcode', 'addr:city'}
          OUT = 'ladepunkte'
          LATS = [(47, 49), (49, 51), (51, 53), (53, 56)]
          LONS = [(5, 7), (7, 9), (9, 11), (11, 13), (13, 16)]

          def fetch(box):
              q = ('[out:json][timeout:170];(node["amenity"="charging_station"](%s);'
                   'way["amenity"="charging_station"](%s););out center meta;' % (box, box))
              body = urllib.parse.urlencode({'data': q}).encode()
              for attempt in range(6):
                  url = SERVERS[attempt % len(SERVERS)]
                  try:
                      req = urllib.request.Request(url, data=body, headers={
                          'User-Agent': 'Ladelog-Ladekarte/1.0 (privates GitHub-Pages-Projekt)'})
                      with urllib.request.urlopen(req, timeout=200) as r:
                          j = json.load(r)
                      if isinstance(j.get('elements'), list):
                          return j
                      print('  unerwartete Antwort von', url)
                  except Exception as e:
                      print('  Versuch %d bei %s: %s' % (attempt + 1, url, e))
                  time.sleep(10 + attempt * 8)
              return None

          def slim(el):
              lat = el.get('lat', (el.get('center') or {}).get('lat'))
              lon = el.get('lon', (el.get('center') or {}).get('lon'))
              if lat is None or lon is None:
                  return None
              tags = {k: v for k, v in (el.get('tags') or {}).items()
                      if k in KEEP or k.startswith('socket:')}
              return {'type': el['type'], 'id': el['id'], 'lat': round(lat, 6), 'lon': round(lon, 6),
                      'timestamp': (el.get('timestamp') or '')[:10], 'tags': tags}

          os.makedirs(OUT, exist_ok=True)
          ok = total = 0
          stamps = []
          for la0, la1 in LATS:
              for lo0, lo1 in LONS:
                  box = '%d,%d,%d,%d' % (la0, lo0, la1, lo1)
                  print('Bereich', box)
                  j = fetch(box)
                  if j is None:
                      print('  übersprungen, alte Dateien bleiben erhalten')
                      continue
                  ok += 1
                  ts = (j.get('osm3s') or {}).get('timestamp_osm_base')
                  if ts:
                      stamps.append(ts)
                  tiles = {(la, lo): [] for la in range(la0, la1) for lo in range(lo0, lo1)}
                  for el in j['elements']:
                      s = slim(el)
                      if not s:
                          continue
                      key = (int(s['lat'] // 1), int(s['lon'] // 1))
                      if key in tiles:
                          tiles[key].append(s)
                  for (la, lo), els in tiles.items():
                      els.sort(key=lambda e: (e['type'], e['id']))
                      total += len(els)
                      with open('%s/%d_%d.json' % (OUT, la, lo), 'w', encoding='utf-8') as f:
                          f.write('[\n' + ',\n'.join(json.dumps(e, ensure_ascii=False, sort_keys=True,
                                                                 separators=(',', ':')) for e in els) + '\n]\n')
                  print('  %d Stationen' % len(j['elements']))
                  time.sleep(5)

          boxes = len(LATS) * len(LONS)
          print('Fertig: %d von %d Bereichen, %d Stationen' % (ok, boxes, total))
          if ok == 0:
              sys.exit('Kein Bereich konnte geladen werden.')
          with open(OUT + '/stand.json', 'w', encoding='utf-8') as f:
              json.dump({'t': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                         'osm': min(stamps) if stamps else '', 'n': total, 'ok': ok, 'boxes': boxes}, f)
          PY

      - name: Speichern
        run: |
          git config user.name "ladelog-bot"
          git config user.email "ladelog-bot@users.noreply.github.com"
          git add ladepunkte
          if git diff --cached --quiet; then
            echo "Keine Änderung"
          else
            git commit -m "Ladekarte $(date -u +%F)"
            git push
          fi
